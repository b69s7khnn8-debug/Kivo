<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kivo</title>
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: rgba(24, 24, 27, 0.8);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-grad: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --text: #fafafa;
      --muted: #71717a;
      --theirs: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--primary-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .logo-text {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.3px;
    }

    .status-pill {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .dot.online {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .btn-invite {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-invite:active {
      transform: scale(0.96);
    }

    #setup-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      max-width: 360px;
      margin: 0 auto;
      width: 100%;
      gap: 14px;
    }

    .hero-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--primary-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
      box-shadow: 0 12px 30px rgba(99, 102, 241, 0.35);
    }

    input {
      background: #121215;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 15px 18px;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: var(--muted);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn-main {
      background: var(--primary-grad);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    #chat-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      height: calc(100dvh - 57px);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.42;
      word-wrap: break-word;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .msg.mine {
      align-self: flex-end;
      background: var(--primary-grad);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.2);
    }

    .msg.theirs {
      align-self: flex-start;
      background: var(--theirs);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-author {
      font-size: 11px;
      color: #818cf8;
      margin-bottom: 3px;
      font-weight: 600;
    }

    .mine .msg-author {
      display: none;
    }

    .msg-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 3px;
    }

    .msg-time {
      font-size: 10px;
      opacity: 0.6;
    }

    #input-area {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 14px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border);
    }

    #msg-input {
      border-radius: 22px;
      padding: 11px 18px;
      background: rgba(255, 255, 255, 0.05);
    }

    #send-btn {
      background: var(--primary-grad);
      color: #fff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: transform 0.15s;
    }

    #send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-icon">K</div>
      <div class="logo-text">Kivo</div>
      <div class="status-pill" id="status-pill">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Сеть</span>
      </div>
    </div>
    <button class="btn-invite" id="share-btn">Пригласить</button>
  </header>

  <div id="setup-screen">
    <div class="hero-icon">K</div>
    <input type="text" id="username" placeholder="Имя" maxlength="20" autocomplete="off">
    <button class="btn-main" id="start-btn">Продолжить</button>
  </div>

  <div id="chat-screen">
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Сообщение" autocomplete="off">
      <button id="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    let client = null;
    let roomId = "";
    let topic = "";
    let cryptoKey = null;
    const myClientId = "kivo_" + Math.random().toString(36).substring(2, 10);
    let username = localStorage.getItem("kivo_name") || "";

    const usernameInput = document.getElementById("username");
    const startBtn = document.getElementById("start-btn");
    const shareBtn = document.getElementById("share-btn");
    const sendBtn = document.getElementById("send-btn");
    const msgInput = document.getElementById("msg-input");

    if (username) usernameInput.value = username;

    async function initSecurity() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      roomId = params.get("room");
      let rawKey = params.get("key");

      if (!roomId || !rawKey) {
        roomId = Math.random().toString(36).substring(2, 12);
        const keyObj = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
        const exported = await crypto.subtle.exportKey("raw", keyObj);
        rawKey = btoa(String.fromCharCode(...new Uint8Array(exported)));
        cryptoKey = keyObj;
        window.location.hash = `room=${roomId}&key=${encodeURIComponent(rawKey)}`;
      } else {
        const keyBytes = Uint8Array.from(atob(rawKey), c => c.charCodeAt(0));
        cryptoKey = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["encrypt", "decrypt"]);
      }
      topic = `kivo_app_v1/rooms/${roomId}`;
    }

    async function encryptText(text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(text);
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, encoded);
      return {
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(cipher)))
      };
    }

    async function decryptText(ivB64, dataB64) {
      try {
        const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
        const data = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKey, data);
        return new TextDecoder().decode(decrypted);
