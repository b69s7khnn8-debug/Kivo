<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kivo — P2P Мессенджер</title>
  <script src="https://unpkg.com"></script>
  <style>
    :root {
      --bg: #0d0f12; --surface: #171a21; --primary: #6366f1;
      --text: #f3f4f6; --muted: #9ca3af; --mine: #4f46e5; --theirs: #1f242d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header {
      background: var(--surface); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #262b36;
    }
    .logo { font-weight: 800; font-size: 20px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; background: rgba(16, 185, 129, 0.15); color: #34d399; padding: 3px 8px; border-radius: 12px; }
    .btn-share { background: #262b36; color: var(--text); border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    #setup-screen {
      flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 400px; margin: 0 auto; width: 100%; gap: 16px;
    }
    #setup-screen h2 { font-size: 24px; text-align: center; }
    #setup-screen p { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.4; }
    input {
      background: var(--surface); border: 1px solid #2d3340; color: #fff; padding: 14px; border-radius: 12px; font-size: 16px; outline: none; width: 100%;
    }
    input:focus { border-color: var(--primary); }
    .btn-main { background: var(--primary); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    #chat-screen { display: none; flex: 1; flex-direction: column; height: calc(100dvh - 56px); }
    #status-bar { background: #1e222b; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg.mine { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; }
    .msg.theirs { align-self: flex-start; background: var(--theirs); border-bottom-left-radius: 4px; }
    .msg-author { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .mine .msg-author { display: none; }
    #input-area { background: var(--surface); padding: 10px 12px; display: flex; gap: 8px; border-top: 1px solid #262b36; }
    #msg-input { border-radius: 20px; padding: 10px 16px; }
    #send-btn { background: var(--primary); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Kivo <span class="badge">🔒 P2P E2EE</span></div>
    <button class="btn-share" id="share-btn" style="display:none;" onclick="copyInvite()">Пригласить</button>
  </header>

  <div id="setup-screen">
    <h2>Kivo — Прямой чат</h2>
    <p>Без серверов и баз данных. Сообщения шифруются и летят напрямую с устройства на устройство.</p>
    <input type="text" id="username" placeholder="Ваш никнейм..." maxlength="20">
    <button class="btn-main" id="start-btn" onclick="startChat()">Войти в чат</button>
  </div>

  <div id="chat-screen">
    <div id="status-bar">Подключение к сети...</div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Написать сообщение..." autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    let peer = null;
    let connections = [];
    let cryptoKey = null;
    let hostId = null;
    let username = localStorage.getItem("kivo_name") || "";
    if (username) document.getElementById("username").value = username;

    async function initSecurity() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      hostId = params.get("host");
      let rawKey = params.get("key");

      if (!rawKey) {
        const keyObj = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
        const exported = await crypto.subtle.exportKey("raw", keyObj);
        rawKey = btoa(String.fromCharCode(...new Uint8Array(exported)));
        cryptoKey = keyObj;
      } else {
        const keyBytes = Uint8Array.from(atob(rawKey), c => c.charCodeAt(0));
        cryptoKey = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["encrypt", "decrypt"]);
      }
      return rawKey;
    }

    async function encryptText(text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(text);
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, encoded);
      return {
        iv: btoa(String.fromCharCode(...iv)),
        data: btoa(String.fromCharCode(...new Uint8Array(cipher)))
      };
    }

    async function decryptText(ivB64, dataB64) {
      try {
        const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
        const data = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, cryptoKey, data);
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return "⚠️ Ошибка расшифровки";
      }
    }

    function setupConnection(conn) {
      conn.on("open", () => {
        if (!connections.find(c => c.peer === conn.peer)) {
          connections.push(conn);
        }
        updateStatus(`В сети участников: ${connections.length + 1}`);
      });

      conn.on("data", async (msg) => {
        if (msg.type === "chat") {
          const plainText = await decryptText(msg.iv, msg.data);
          renderMessage(msg.author, plainText, false);
          // Если мы хост, пересылаем сообщение остальным участникам комнаты
          connections.forEach(c => {
            if (c.peer !== conn.peer && c.open) c.send(msg);
          });
        }
      });

      conn.on("close", () => {
        connections = connections.filter(c => c.peer !== conn.peer);
        updateStatus(`В сети участников: ${connections.length + 1}`);
      });
    }

    function updateStatus(text) {
      document.getElementById("status-bar").textContent = text;
    }

    async function startChat() {
      const inputName = document.getElementById("username").value.trim();
      if (!inputName) return alert("Введи никнейм!");
      username = inputName;
      localStorage.setItem("kivo_name", username);

      const btn = document.getElementById("start-btn");
      btn.disabled = true;
      btn.textContent = "Подключение...";

      const rawKey = await initSecurity();
      peer = new Peer();

      peer.on("open", (myId) => {
        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        document.getElementById("share-btn").style.display = "block";

        if (!hostId) {
          hostId = myId;
          window.location.hash = `host=${hostId}&key=${encodeURIComponent(rawKey)}`;
          updateStatus("Комната создана. Нажми «Пригласить» и отправь ссылку другу!");
        } else {
          updateStatus("Подключение к собеседнику...");
          const conn = peer.connect(hostId);
          setupConnection(conn);
        }
      });

      peer.on("connection", (conn) => {
        setupConnection(conn);
      });

      peer.on("error", (err) => {
        updateStatus("Ошибка сети: " + err.type + ". Обнови страницу.");
      });
    }

    async function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      const encrypted = await encryptText(text);
      const payload = {
        type: "chat",
        author: username,
        iv: encrypted.iv,
        data: encrypted.data
      };

      renderMessage(username, text, true);
      connections.forEach(conn => {
        if (conn.open) conn.send(payload);
      });
    }

    function renderMessage(author, text, isMine) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg " + (isMine ? "mine" : "theirs");
      
      const authorEl = document.createElement("div");
      authorEl.className = "msg-author";
      authorEl.textContent = author;

      const textEl = document.createElement("div");
      textEl.textContent = text;

      div.appendChild(authorEl);
      div.appendChild(textEl);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function copyInvite() {
      navigator.clipboard.writeText(window.location.href);
      alert("Ссылка-приглашение скопирована! Отправь её другу — пока ты не закрыл эту вкладку, он сможет подключиться.");
    }

    document.getElementById("msg-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
